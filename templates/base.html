<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LetterBit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                LetterBit
            </a>

            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="btn btn-outline-light btn-sm">
                        Meu Perfil
                    </a>
                    <a href="{% url 'edit_profile' %}" class="btn btn-outline-secondary btn-sm text-light border-secondary">
                        Editar Perfil
                    </a>
                    <form action="{% url 'logout' %}" method="POST" class="d-inline m-0">
                        {% csrf_token %}
                        <button class="btn btn-danger btn-sm">
                            Sair
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
                        Login
                    </a>
                    <a href="{% url 'register' %}" class="btn btn-light btn-sm">
                        Cadastro
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const alerts = document.querySelectorAll('.alert');
            
            alerts.forEach(function(alertElement) {
                setTimeout(function() {
                    if (typeof bootstrap !== 'undefined' && bootstrap.Alert) {
                        const bsAlert = new bootstrap.Alert(alertElement);
                        bsAlert.close();
                    } else {
                        alertElement.style.transition = "opacity 0.3s ease";
                        alertElement.style.opacity = "0";
                        setTimeout(() => alertElement.remove(), 300);
                    }
                }, 1500); 
            });
        });
    </script>
</body>
</html>
