{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <img
                            src="https://ui-avatars.com/api/?name={{ user.username }}&background=212529&color=fff&size=128"
                            class="rounded-circle mb-3"
                        >

                        <h2>
                            {{ user.username }}
                        </h2>

                        <p class="text-muted">
                            Membro desde
                            {{ user.date_joined|date:"d/m/Y" }}
                        </p>

                    </div>

                    <hr>

                    <div class="mt-4">

                        <h5 class="mb-3">
                            Informações da Conta
                        </h5>

                        <p>
                            <strong>Usuário:</strong>
                            {{ user.username }}
                        </p>

                        <p>
                            <strong>Email:</strong>
                            {{ user.email }}
                        </p>

                    </div>

                    <div class="mt-4">

                        <a href="{% url 'edit_profile' %}" class="btn btn-dark">
                            Editar Perfil
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
