{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Login
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Usuário</label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                        >
                    </div>

                    <div class="mb-3">
                        <label>Senha</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                        >
                    </div>

                    <button class="btn btn-dark w-100">
                        Entrar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
